name: Claude

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: plusminus-software/plusminus-workflows/.github/workflows/claude.yml@main
    secrets:
      token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
